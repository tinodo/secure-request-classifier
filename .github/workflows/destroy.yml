name: Destroy

# Removes everything the DEPLOY workflow creates: the Azure resource group and everything in it,
# and the Power Platform environment including its Dataverse database and the imported solution.
#
# It does NOT remove two things, both deliberate, both opt-in or never:
#
#   * The two Microsoft Entra ID app registrations. These are created by the BOOTSTRAP
#     (scripts/Initialize-EntraResources.ps1), not by a deployment, and the deployment one is the
#     identity these pipelines sign in with. Deleting it means re-running the bootstrap and
#     re-setting every repository secret before you can deploy again, so it is opt-in via
#     remove-entra-applications. Deploy is happy to run repeatedly against the same pair.
#
#   * The "HTTP with Microsoft Entra ID" connector service principal and its delegated
#     permission grant. That is a shared, tenant-wide Microsoft first-party application that
#     other solutions in the tenant may depend on. It is never removed, at all, by design.
#
# So: everything the deploy pipeline builds is destroyed; the one-time bootstrap identity
# survives unless you ask otherwise. Run summary states which of these applied.
#
# Requires an explicit typed confirmation, refuses to delete a resource group that does not carry
# the demo's own workload tag, and refuses to delete an environment whose display name does not
# match POWER_PLATFORM_ENVIRONMENT_NAME.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY to confirm
        required: true
        type: string
      keep-power-platform-environment:
        description: Keep the Power Platform environment (only unlink it and uninstall the solution)
        type: boolean
        default: false
      remove-entra-applications:
        description: Also delete the app registrations created by the bootstrap script (leaves you unable to deploy until you re-run it)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: destroy
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy the demo
    runs-on: ubuntu-latest
    # Deleting a Dataverse environment and a resource group full of private endpoints both take
    # their time, and this job waits for each rather than reporting success while they run.
    timeout-minutes: 90
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'demo' }}
    steps:
      - name: Check the confirmation
        # Via env, not interpolated into the script body. Only users with write access can set
        # this, so no trust boundary is crossed either way, but published reference material
        # should not model injecting an input straight into a shell comparison.
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DESTROY" ]; then
            echo "::error::Confirmation text did not match. Type DESTROY to proceed."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the Power Platform environment
        id: environment
        shell: pwsh
        run: |
          ./scripts/Resolve-PowerPlatformEnvironment.ps1 `
            -DisplayName '${{ vars.POWER_PLATFORM_ENVIRONMENT_NAME || 'srclass-demo' }}' | Out-Null

      - name: Remove the demo
        shell: pwsh
        env:
          ENVIRONMENT_ID: ${{ steps.environment.outputs.environment-id }}
          ENVIRONMENT_URL: ${{ steps.environment.outputs.environment-url }}
          ENVIRONMENT_NAME: ${{ vars.POWER_PLATFORM_ENVIRONMENT_NAME || 'srclass-demo' }}
        run: |
          $parameters = @{
            ResourceGroupName = '${{ vars.RESOURCE_GROUP_NAME || 'rg-srclass-demo' }}'
            Force             = $true
            Confirm           = $false
          }

          if ($env:ENVIRONMENT_ID) {
            $parameters.PowerPlatformEnvironmentId   = $env:ENVIRONMENT_ID
            $parameters.PowerPlatformEnvironmentName = $env:ENVIRONMENT_NAME
          }
          else {
            Write-Warning "No Power Platform environment named '$($env:ENVIRONMENT_NAME)' was found; nothing to unlink or delete."
          }

          if ($env:ENVIRONMENT_URL) {
            $parameters.PowerPlatformEnvironmentUrl = $env:ENVIRONMENT_URL
          }

          if ('${{ inputs.keep-power-platform-environment }}' -eq 'true') {
            $parameters.KeepPowerPlatformEnvironment = $true
          }

          if ('${{ inputs.remove-entra-applications }}' -eq 'true') {
            $parameters.RemoveEntraApplications = $true
          }

          ./scripts/Remove-Demo.ps1 @parameters

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Cleanup"
            echo
            echo "| Item | Removed |"
            echo "| --- | --- |"
            echo "| Resource group \`${{ vars.RESOURCE_GROUP_NAME || 'rg-srclass-demo' }}\` | yes, and waited for it |"
            if [ "${{ inputs.keep-power-platform-environment }}" = "true" ]; then
              echo "| Power Platform environment | no — kept on request, solution uninstalled and policy unlinked |"
            else
              echo "| Power Platform environment | yes, including its Dataverse database and the solution |"
            fi
            if [ "${{ inputs.remove-entra-applications }}" = "true" ]; then
              echo "| Entra app registrations (from the bootstrap) | yes — re-run \`Initialize-EntraResources.ps1\` and reset the repository secrets before deploying again |"
            else
              echo "| Entra app registrations (from the bootstrap) | no — kept by design, so Deploy can run again without re-bootstrapping |"
            fi
            echo "| Connector service principal and its grant | no — never removed: shared tenant-wide Microsoft application |"
            echo
            echo "Everything the Deploy workflow creates is gone. The bootstrap identity survives"
            echo "unless \`remove-entra-applications\` was ticked. Nothing outside the resource"
            echo "group and that environment was modified."
          } >> "$GITHUB_STEP_SUMMARY"
