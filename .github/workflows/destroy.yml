name: Destroy

# Removes everything the Deploy workflow and the bootstrap create: the Azure resource group, the
# Power Platform environment, and the two Microsoft Entra ID app registrations.
#
# Deleting the app registrations removes the identity these pipelines authenticate with, so
# before deploying again you must re-run scripts/Initialize-EntraResources.ps1 and set the
# repository secrets it prints. Untick remove-entra-applications to keep them and skip that.
#
# It never removes the "HTTP with Microsoft Entra ID" connector service principal or its
# delegated permission grant: that is a shared, tenant-wide Microsoft first-party application
# that other solutions in the tenant may depend on. It is not ours to delete.
#
# Requires an explicit typed confirmation, refuses to delete a resource group that does not carry
# the demo's own workload tag, and refuses to delete an environment whose display name does not
# match POWER_PLATFORM_ENVIRONMENT_NAME.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY to confirm
        required: true
        type: string
      keep-power-platform-environment:
        description: Keep the Power Platform environment (only unlink it and uninstall the solution)
        type: boolean
        default: false
      remove-entra-applications:
        description: Also delete the app registrations created by the bootstrap script
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: destroy
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy the demo
    runs-on: ubuntu-latest
    # Deleting a Dataverse environment and a resource group full of private endpoints both take
    # their time, and this job waits for each rather than reporting success while they run.
    timeout-minutes: 90
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'demo' }}
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "::error::Confirmation text did not match. Type DESTROY to proceed."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve the Power Platform environment
        id: environment
        shell: pwsh
        run: |
          ./scripts/Resolve-PowerPlatformEnvironment.ps1 `
            -DisplayName '${{ vars.POWER_PLATFORM_ENVIRONMENT_NAME || 'srclass-demo' }}' | Out-Null

      - name: Remove the demo
        shell: pwsh
        env:
          ENVIRONMENT_ID: ${{ steps.environment.outputs.environment-id }}
          ENVIRONMENT_URL: ${{ steps.environment.outputs.environment-url }}
          ENVIRONMENT_NAME: ${{ vars.POWER_PLATFORM_ENVIRONMENT_NAME || 'srclass-demo' }}
        run: |
          $parameters = @{
            ResourceGroupName = '${{ vars.RESOURCE_GROUP_NAME || 'rg-srclass-demo' }}'
            Force             = $true
            Confirm           = $false
          }

          if ($env:ENVIRONMENT_ID) {
            $parameters.PowerPlatformEnvironmentId   = $env:ENVIRONMENT_ID
            $parameters.PowerPlatformEnvironmentName = $env:ENVIRONMENT_NAME
          }
          else {
            Write-Warning "No Power Platform environment named '$($env:ENVIRONMENT_NAME)' was found; nothing to unlink or delete."
          }

          if ($env:ENVIRONMENT_URL) {
            $parameters.PowerPlatformEnvironmentUrl = $env:ENVIRONMENT_URL
          }

          if ('${{ inputs.keep-power-platform-environment }}' -eq 'true') {
            $parameters.KeepPowerPlatformEnvironment = $true
          }

          if ('${{ inputs.remove-entra-applications }}' -ne 'true') {
            $parameters.KeepEntraApplications = $true
          }

          ./scripts/Remove-Demo.ps1 @parameters

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Cleanup"
            echo
            echo "| Item | Removed |"
            echo "| --- | --- |"
            echo "| Resource group \`${{ vars.RESOURCE_GROUP_NAME || 'rg-srclass-demo' }}\` | yes, and waited for it |"
            if [ "${{ inputs.keep-power-platform-environment }}" = "true" ]; then
              echo "| Power Platform environment | no — kept on request, solution uninstalled and policy unlinked |"
            else
              echo "| Power Platform environment | yes, including its Dataverse database and the solution |"
            fi
            if [ "${{ inputs.remove-entra-applications }}" = "false" ]; then
              echo "| Entra app registrations | no — kept on request, so Deploy still works without re-bootstrapping |"
            else
              echo "| Entra app registrations | yes — re-run \`Initialize-EntraResources.ps1\` and reset the repository secrets before deploying again |"
            fi
            echo "| Connector service principal and grant | no — shared tenant-wide Microsoft application |"
            echo
            echo "Nothing outside the resource group and that environment was modified."
          } >> "$GITHUB_STEP_SUMMARY"
